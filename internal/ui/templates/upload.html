<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meiling — upload</title>
<link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="logo">meiling</div>
    <div class="nav">
      <a href="/ui/">dashboard</a>
      <a href="/ui/logout">sign out</a>
      <span class="user-badge">{{.Account}}</span>
      {{if eq .Account "demo@example.com"}}
      <a href="/ui/admin/" style="color:var(--accent);">admin</a>
      {{end}}
    </div>
  </div>

  <div class="page-title">ingest object</div>

  {{if .Error}}
  <div class="flash">{{.Error}}</div>
  {{end}}

  <div class="form-card">
    <form method="post" action="/ui/upload" enctype="multipart/form-data">
      <label for="uploadbucket">bucket</label>
      <input id="uploadbucket" name="bucket" type="text" placeholder="demo-bucket" required style="width:100%; margin-bottom:8px; display:block;">

      <label for="uploadkey">object key</label>
      <input id="uploadkey" name="key" type="text" placeholder="music/song.mp3" required style="width:100%; margin-bottom:8px; display:block;">

      <label for="uploadfile">file</label>
      <input id="uploadfile" name="file" type="file" required style="width:100%; margin-bottom:8px; display:block;">

      <label for="uploadmeta">x-amz-meta-title (optional)</label>
      <input id="uploadmeta" name="x-amz-meta-title" type="text" placeholder="music title" style="width:100%; margin-bottom:16px; display:block;">

      <div class="form-actions">
        <button type="submit">ingest</button>
        <a href="/ui/" class="ghost">cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
