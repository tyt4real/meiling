<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meiling — admin / accounts</title>
<link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="logo">meiling<span class="logo-sub">·s3 ipfs gateway</span></div>
    <div class="nav">
      <a href="/ui/admin/">admin</a>
      <a href="/ui/logout">sign out</a>
      <span class="user-badge">{{.Account}}</span>
    </div>
  </div>

  <div class="page-title">account management</div>

  <div class="section">
    <div class="section-title">create account</div>
    <div class="form-card" style="max-width:460px;">
      {{if .Error}}
      <div class="flash">{{.Error}}</div>
      {{end}}
      <form method="post" action="/ui/admin/accounts">
        <label for="email">account email</label>
        <input id="email" name="email" type="email" placeholder="user@example.com" required style="width:100%; margin-bottom:8px; display:block;">
        <label for="role">role</label>
        <select id="role" name="role" style="width:100%; margin-bottom:8px; display:block;">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
        <div class="form-actions">
          <button type="submit">create account</button>
          <a href="/ui/admin/" class="ghost">cancel</a>
        </div>
      </form>
    </div>
  </div>

  <div class="section" style="margin-top:32px;">
    <div class="section-title">existing accounts</div>
    {{if .Accounts}}
    <table>
      <thead>
        <tr><th>email</th><th>role</th><th>created</th></tr>
      </thead>
      <tbody>
        {{range .Accounts}}
        <tr>
          <td class="mono">{{.Email}}</td>
          <td><span class="badge {{if eq .Role "admin"}}active{{else}}inactive{{end}}">{{.Role}}</span></td>
          <td class="mono">{{.CreatedAt}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
    {{else}}
    <div class="empty">no accounts found.</div>
    {{end}}
  </div>
</div>
</body>
</html>
