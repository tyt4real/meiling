<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meiling &mdash; session start</title>
<link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="logo">meiling<span class="logo-sub">·s3 ipfs gateway</span></div>
    <div class="nav">
      <a href="/">api root</a>
      <a href="/healthz">health</a>
      <a href="/metrics">metrics</a>
    </div>
  </div>

  <div class="form-card" style="max-width: 460px; margin: 0 auto;">
    <div class="page-title" style="text-align:center;">session start</div>
    {{if .Error}}
    <div class="flash">{{.Error}}</div>
    {{end}}
    <form method="post" action="/ui/login">
      <label for="email">account email</label>
      <input id="email" name="email" type="email" placeholder="demo@example.com" required autofocus>

      <label for="password">access secret</label>
      <input id="password" name="password" type="password" placeholder="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" required>

      <div class="form-actions">
        <button type="submit">connect</button>
        <a href="/" class="ghost">api endpoint</a>
      </div>
    </form>
    <p style="margin-top:18px; font-size:11px; color:var(--fg-dim); text-align:center; line-height:1.6;">
      authenticate with your s3 seed credentials.<br>
      demo: <span class="mono">AKIAIOSFODNN7EXAMPLE</span> / <span class="mono">wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY</span>
    </p>
  </div>
</div>
</body>
</html>
