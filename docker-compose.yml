services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: s3ipfs
      POSTGRES_PASSWORD: s3ipfs
      POSTGRES_DB: s3ipfs
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3ipfs -d s3ipfs"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgres://s3ipfs:s3ipfs@db:5432/s3ipfs?sslmode=disable
      STORAGE_PATH: /data
      LISTEN_ADDR: :8080
      PUBLIC_HOST: http://localhost:8080
      ACCESS_KEY_ID: ${SEED_ACCESS_KEY_ID:-AKIAIOSFODNN7EXAMPLE}
      SECRET_ACCESS_KEY: ${SEED_SECRET_ACCESS_KEY:-wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
      IPFS_NODE_ENDPOINTS: ${IPFS_NODE_ENDPOINTS:-http://ipfs-node-1:5001,http://ipfs-node-2:5001}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-fs}
      IPFS_ENDPOINT: ${IPFS_ENDPOINT:-http://localhost:5001}
      IPFS_CACHE_DIR: ${IPFS_CACHE_DIR:-/data/ipfs-cache}
      UI_SECRET: ${UI_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - storage_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  storage_data:
